<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* Shared CSS for all emails */
    body {
      font-family: 'Roboto', Arial, sans-serif;
      color: #333333;
      background-color: #f5f5f5; /* cradle-bg-secondary */
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background-color: #ffffff; /* cradle-bg-elevated */
      border: 1px solid #e0e0e0; /* cradle-border-primary */
      border-radius: 8px; /* cradle-radius-md */
    }
    h2 {
      color: #000000; /* cradle-text-primary */
      margin-top: 0;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    p {
      line-height: 1.6;
      margin: 15px 0;
      color: #333333; /* cradle-text-secondary */
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      margin: 20px 0;
      color: #ffffff;
      background-color: #ff8c00; /* cradle-accent-primary */
      text-decoration: none;
      border-radius: 6px; /* cradle-radius-sm */
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 14px;
    }
    .footer {
      font-size: 12px;
      color: #999999; /* cradle-text-muted */
      margin-top: 40px;
      text-align: center;
      border-top: 1px solid #e0e0e0;
      padding-top: 20px;
    }
    .footer p {
      margin: 5px 0;
      color: #999999;
    }
    .note {
      font-size: 13px;
      color: #999999; /* cradle-text-muted */
      margin: 20px 0 0;
      border-left: 2px solid #e0e0e0;
      padding-left: 10px;
    }
    a {
      color: #ff8c00;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    {% block content %}
    {% endblock %}
    <div class="footer">
      <p>Powered by CRADLE</p>
    </div>
  </div>
</body>
</html>
