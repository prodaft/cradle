name: cradle-demo

x-backend-env: &backend-env
  SECRET_KEY: super-secret-key
  DEBUG: "true"

  FRONTEND_URL: http://localhost:8000

  DB_HOST: postgres
  DB_USER: cradle
  DB_PASSWORD: cradle

  MINIO_ENDPOINT: minio:9000
  AWS_S3_PUBLIC_ENDPOINT_URL: http://localhost:8000

  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://cradle:cradle@rabbitmq:5672//

  CRADLE_ADMIN_EMAIL: admin@cradle.sh
  CRADLE_ADMIN_PASSWORD: admin

  NUM_WORKERS: "4"

x-backend: &backend
  image: ghcr.io/prodaft/cradle:latest
  build:
    context: .
    dockerfile: ./docker/Dockerfile.backend
  restart: unless-stopped
  environment: *backend-env
  networks: [internal, web, egress]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  cradle:
    <<: *backend
    volumes:
      - media:/media
      - static:/app/static
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null -H "Host: localhost" http://localhost:8000/api/auth/config/ &&
          curl -fsS -o /dev/null -H "Host: localhost" http://localhost:8001/api/auth/config/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  celery:
    <<: *backend
    command: /app/entrypoint_celery.sh
    depends_on:
      cradle:
        condition: service_healthy
    volumes:
      - media:/media
      - /var/run/docker.sock:/var/run/docker.sock

  ui:
    image: ghcr.io/prodaft/cradle-web:latest
    build:
      context: .
      dockerfile: ./docker/Dockerfile.ui
    restart: unless-stopped
    volumes:
      - static:/www/static
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    networks: [web, egress]
    depends_on:
      cradle:
        condition: service_healthy

  postgres:
    image: pgrouting/pgrouting:16-3.5-4.0
    networks: [internal]
    restart: unless-stopped
    environment:
      POSTGRES_DB: cradle
      POSTGRES_USER: cradle
      POSTGRES_PASSWORD: cradle
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cradle -d cradle"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    networks: [internal]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-alpine
    networks: [internal]
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cradle
      RABBITMQ_DEFAULT_PASS: cradle
    volumes:
      - ./docker/rabbitmq.conf:/etc/rabbitmq/conf.d/10-celery.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    networks: [internal, web]
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: cradle_minio
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  internal:
    internal: true
  web:
    internal: true
  egress:

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  media:
  static:
