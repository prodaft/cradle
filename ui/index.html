<!doctype html>
<html data-theme="light" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <meta
            content="default-src *; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cradle.yigit.run/api https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' data: *;"
            http-equiv="Content-Security-Policy"
        />
        <title>CRADLE</title>
        <!-- Blocking script to prevent theme flash on load -->
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem('theme');
                    if (stored) {
                        var theme = JSON.parse(stored);
                        var root = document.documentElement;
                        for (var key in theme) {
                            if (key !== 'name' && typeof theme[key] === 'string') {
                                root.style.setProperty(key, theme[key]);
                            }
                        }
                    }
                } catch (e) {}
            })();
        </script>
        <link
            rel="icon"
            type="image/svg+xml"
            href="./src/assets/favicon/favicon-light.svg"
            media="(prefers-color-scheme: dark)"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="./src/assets/favicon/favicon-dark.svg"
            media="(prefers-color-scheme: light)"
        />
    </head>

    <body class="h-screen w-screen p-0 m-0 overflow-hidden overflow-y-hidden">
        <div id="portal-root"></div>
        <div class="w-screen h-full p-0 m-0" id="root"></div>
    </body>
</html>
