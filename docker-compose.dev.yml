name: cradle-dev

services:
  postgres:
    image: pgrouting/pgrouting:16-3.5-4.0
    command: postgres -c log_statement=all
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cradle
      POSTGRES_USER: cradle
      POSTGRES_PASSWORD: cradle
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cradle -d cradle"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cradle
      RABBITMQ_DEFAULT_PASS: cradle
    volumes:
      - ./docker/rabbitmq.conf:/etc/rabbitmq/conf.d/10-celery.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server --console-address ":9001" /data
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: cradle_minio
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cradle.sh
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: keycloak/keycloak:26.5.4
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
