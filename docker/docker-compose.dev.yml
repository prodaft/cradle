services:
  postgres:
    image: pgrouting/pgrouting:16-3.5-4.0
    container_name: cradle_postgres
    command: postgres -c log_statement=all
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cradle
      - POSTGRES_USER=cradle
      - POSTGRES_PASSWORD=cradle
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 192.168.31.40

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cradle_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cradle.sh
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      default:
        ipv4_address: 192.168.31.43

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: cradle_rabbitmq
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: cradle
      RABBITMQ_DEFAULT_PASS: cradle
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/10-celery.conf:ro
    networks:
      default:
        ipv4_address: 192.168.31.44

  minio:
    # MinIO no longer publishes community images; Silo is the Pigsty-maintained,
    # drop-in MinIO fork (same S3 API, MINIO_* env vars, ports and data format).
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server --console-address ":9001" /data
    container_name: cradle_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: cradle_minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        ipv4_address: 192.168.31.41

  redis:
    image: redis:8-alpine
    container_name: cradle_redis
    ports:
      - "6379:6379"
    networks:
      default:
        ipv4_address: 192.168.31.42

  keycloak:
    image: keycloak/keycloak:26.5.4
    container_name: cradle_keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      default:
        ipv4_address: 192.168.31.45

volumes:
  pg_data:
  minio_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.31.32/27
