# nginx for docker-compose.prod.yml and docker-compose.demo.yml. Plain HTTP; in prod, TLS is
# terminated by an outer reverse proxy, which must pass the Host header through and set
# X-Forwarded-Proto.

user www;
worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events
{
	worker_connections 1024;
}

http
{
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /dev/stdout;
	server_tokens off;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 60;
	client_body_timeout 15;

	gzip on;
	gzip_vary on;
	gzip_min_length 1k;

	resolver 127.0.0.11 valid=10s ipv6=off;

	map $http_x_forwarded_proto $forwarded_proto
	{
		default $http_x_forwarded_proto;
		"" $scheme;
	}

	server
	{
		listen 8000 default_server;
		server_name _;

		client_max_body_size 0;
		proxy_buffering off;
		proxy_request_buffering off;

		set $backend http://cradle:8000;
		set $live http://cradle:8001;
		set $storage http://minio:9000;

		location /
		{
			root /www/cradle;
			index _shell.html;
			try_files $uri $uri/ /_shell.html =404;
		}

		location /api/ws/
		{
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_read_timeout 1h;
			proxy_pass $live;
		}

		location /api
		{
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_redirect off;
			proxy_pass $backend;
		}

		location /static/
		{
			alias /www/static/;
		}

		location ~ ^/cradle-(files|relations|reports|digests)/
		{
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_pass $storage;
		}
	}
}
